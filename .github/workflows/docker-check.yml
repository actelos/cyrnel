name: Docker Check

permissions:
  contents: read

on:
  push:
    branches: [develop, main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/mcp/**"
      - "packages/libs/**"
      - "packages/modules/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".dockerignore"
      - "Dockerfile*"
  pull_request:
    types: [opened, synchronize]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/mcp/**"
      - "packages/libs/**"
      - "packages/modules/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".dockerignore"
      - "Dockerfile*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Build ${{ matrix.app }} image (attempt 1/3)
        id: build1
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: cyrnel-${{ matrix.app }}:ci

      - name: Build ${{ matrix.app }} image (attempt 2/3)
        id: build2
        if: steps.build1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: cyrnel-${{ matrix.app }}:ci

      - name: Build ${{ matrix.app }} image (attempt 3/3)
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: cyrnel-${{ matrix.app }}:ci

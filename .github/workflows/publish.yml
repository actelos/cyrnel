name: Publish

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build --filter=@cyrnel/sdk

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm exec changeset publish
          version: pnpm exec changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cyrnel-api (attempt 1/3)
        id: api1
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/api:latest,${{ env.REGISTRY }}/${{ github.repository }}/api:${{ env.IMAGE_TAG }}

      - name: Build and push cyrnel-api (attempt 2/3)
        id: api2
        if: steps.api1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/api:latest,${{ env.REGISTRY }}/${{ github.repository }}/api:${{ env.IMAGE_TAG }}

      - name: Build and push cyrnel-api (attempt 3/3)
        if: steps.api1.outcome == 'failure' && steps.api2.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/api:latest,${{ env.REGISTRY }}/${{ github.repository }}/api:${{ env.IMAGE_TAG }}

      - name: Build and push cyrnel-web (attempt 1/3)
        id: web1
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/web:latest,${{ env.REGISTRY }}/${{ github.repository }}/web:${{ env.IMAGE_TAG }}

      - name: Build and push cyrnel-web (attempt 2/3)
        id: web2
        if: steps.web1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/web:latest,${{ env.REGISTRY }}/${{ github.repository }}/web:${{ env.IMAGE_TAG }}

      - name: Build and push cyrnel-web (attempt 3/3)
        if: steps.web1.outcome == 'failure' && steps.web2.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/web:latest,${{ env.REGISTRY }}/${{ github.repository }}/web:${{ env.IMAGE_TAG }}

      - name: Build and push cyrnel-mcp (attempt 1/3)
        id: mcp1
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mcp/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/mcp:latest,${{ env.REGISTRY }}/${{ github.repository }}/mcp:${{ env.IMAGE_TAG }}

      - name: Build and push cyrnel-mcp (attempt 2/3)
        id: mcp2
        if: steps.mcp1.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mcp/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/mcp:latest,${{ env.REGISTRY }}/${{ github.repository }}/mcp:${{ env.IMAGE_TAG }}

      - name: Build and push cyrnel-mcp (attempt 3/3)
        if: steps.mcp1.outcome == 'failure' && steps.mcp2.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/mcp/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/mcp:latest,${{ env.REGISTRY }}/${{ github.repository }}/mcp:${{ env.IMAGE_TAG }}

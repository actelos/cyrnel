name: Dependabot fix
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  fix-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.DEPENDABOT_FIX_PAT }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "dependabot-fix[bot]"
            git config user.email "dependabot-fix[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update lockfile"
            git push
          fi

# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en

reviews:
  auto_review:
    enabled: true
    base_branches:
      - main
      - develop
  path_filters:
    - "!docs/**"
    - "!**/drizzle/**"
    - "!apps/api/openapi/**"
    - "!docs/openapi/**"
    - "!**/*.md"
    - "!**/Dockerfile"
    - "!**/.example.env"
    - "!**/.gitignore"
    - "!docker-compose*.yml"
    - "!**/package.json"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/*.test.ts"
    - "!**/*.test.tsx"
    - "!examples/**"
    - "!pnpm-lock.yaml"
    - "!biome.json"
    - "!opencode.json"
    - "!.github/workflows/check.yml"
    - "!apps/api/tsconfig.json"
    - "!apps/api/vitest.config.ts"
    - "!apps/web/vite.config.ts"
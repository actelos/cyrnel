# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en

reviews:
  auto_review:
    enabled: true
    base_branches:
      - main
      - develop
  # Keep the reviewed file set small enough for CodeRabbit's limit.
  # Exclude docs, generated SQL/JSON, OpenAPI, lockfiles, and config noise
  # so the review focuses on source code.
  path_filters:
    - "!docs/**"
    - "!**/drizzle/**"
    - "!**/openapi.json"
    - "!**/*.md"
    - "!**/Dockerfile"
    - "!**/.example.env"
    - "!**/.gitignore"
    - "!docker-compose*.yml"
    - "!**/package.json"
    - "!**/node_modules/**"
    - "!**/dist/**"

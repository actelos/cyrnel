services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-9371}:9371"
    environment:
      NODE_ENV: production
      PORT: "9371"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      CYRNEL_DATA_DIR: /data
      CYRNEL_API_KEY: ${CYRNEL_API_KEY:-}
      CYRNEL_SECRETS_KEY: ${CYRNEL_SECRETS_KEY:-}
      CYRNEL_SECRETS_PREVIOUS_KEYS: ${CYRNEL_SECRETS_PREVIOUS_KEYS:-}
      CYRNEL_ALLOWED_IPS: ${CYRNEL_ALLOWED_IPS:-}
      CYRNEL_BLOCKED_IPS: ${CYRNEL_BLOCKED_IPS:-}
      CYRNEL_REGISTRY_ALLOWED_IPS: ${CYRNEL_REGISTRY_ALLOWED_IPS:-}
      CYRNEL_REGISTRY_BLOCKED_IPS: ${CYRNEL_REGISTRY_BLOCKED_IPS:-}
      CYRNEL_EMBEDDING_MODEL: ${CYRNEL_EMBEDDING_MODEL:-Xenova/bge-small-en-v1.5}
      CYRNEL_RECONCILE_INTERVAL_MS: ${CYRNEL_RECONCILE_INTERVAL_MS:-1800000}
    volumes:
      - cyrnel-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9371/health', r => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CYRNEL_API_URL: ""
    ports:
      - "${WEB_PORT:-9372}:9372"
    environment:
      PORT: "9372"
      HOST: 0.0.0.0
      CYRNEL_API_URL: http://api:9371
      CYRNEL_API_KEY: ${CYRNEL_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    ports:
      - "${MCP_PORT:-9373}:9373"
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "9373"
      CYRNEL_API_URL: http://api:9371
      CYRNEL_API_KEY: ${CYRNEL_API_KEY:-}
      CYRNEL_API_TIMEOUT_MS: ${CYRNEL_API_TIMEOUT_MS:-60000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cyrnel-data:

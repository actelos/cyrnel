services:
  api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-actelos/cyrnel}/api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-9371}:9371"
    environment:
      NODE_ENV: production
      PORT: "9371"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CYRNEL_DATA_DIR: /data
      CYRNEL_DB_URL: ${CYRNEL_DB_URL:-}
      CYRNEL_API_KEY: ${CYRNEL_API_KEY:-}
      CYRNEL_SECRETS_KEY: ${CYRNEL_SECRETS_KEY:-}
      CYRNEL_SECRETS_PREVIOUS_KEYS: ${CYRNEL_SECRETS_PREVIOUS_KEYS:-}
      CYRNEL_ALLOWED_IPS: ${CYRNEL_ALLOWED_IPS:-}
      CYRNEL_BLOCKED_IPS: ${CYRNEL_BLOCKED_IPS:-}
      CYRNEL_REGISTRY_ALLOWED_IPS: ${CYRNEL_REGISTRY_ALLOWED_IPS:-}
      CYRNEL_REGISTRY_BLOCKED_IPS: ${CYRNEL_REGISTRY_BLOCKED_IPS:-}
      CYRNEL_BLOCK_ALL_REGISTRIES: ${CYRNEL_BLOCK_ALL_REGISTRIES:-false}
    volumes:
      - cyrnel-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9371/health', r => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-actelos/cyrnel}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CYRNEL_API_URL: ""
    ports:
      - "${WEB_PORT:-9372}:9372"
    environment:
      PORT: "9372"
      HOST: 0.0.0.0
      CYRNEL_API_URL: http://api:9371
      CYRNEL_API_KEY: ${CYRNEL_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-actelos/cyrnel}/mcp:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    ports:
      - "${MCP_PORT:-9373}:9373"
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "9373"
      CYRNEL_API_URL: http://api:9371
      CYRNEL_API_KEY: ${CYRNEL_API_KEY:-}
      CYRNEL_API_TIMEOUT_MS: ${CYRNEL_API_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cyrnel-data:

services:
  api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-actelos/cyrnel}/api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-9371}:9371"
    environment:
      NODE_ENV: production
      PORT: "9371"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      CYRNEL_DATA_DIR: /data
      CYRNEL_DB_URL: ${CYRNEL_DB_URL:-}
      CYRNEL_API_KEY: ${CYRNEL_API_KEY:-}
      CYRNEL_SECRETS_KEY: ${CYRNEL_SECRETS_KEY:-}
      CYRNEL_SECRETS_PREVIOUS_KEYS: ${CYRNEL_SECRETS_PREVIOUS_KEYS:-}
      CYRNEL_LOG_ROTATION_MB: ${CYRNEL_LOG_ROTATION_MB:-10}
      CYRNEL_LOG_MAX_FILES: ${CYRNEL_LOG_MAX_FILES:-5}
      CYRNEL_LOG_RING_BUFFER: ${CYRNEL_LOG_RING_BUFFER:-10000}
      CYRNEL_LOG_DEDUPE_WINDOW_MS: ${CYRNEL_LOG_DEDUPE_WINDOW_MS:-0}
      CYRNEL_ALLOWED_IPS: ${CYRNEL_ALLOWED_IPS:-}
      CYRNEL_BLOCKED_IPS: ${CYRNEL_BLOCKED_IPS:-}
      CYRNEL_REGISTRY_ALLOWED_IPS: ${CYRNEL_REGISTRY_ALLOWED_IPS:-}
      CYRNEL_REGISTRY_BLOCKED_IPS: ${CYRNEL_REGISTRY_BLOCKED_IPS:-}
      CYRNEL_BLOCK_ALL_REGISTRIES: ${CYRNEL_BLOCK_ALL_REGISTRIES:-false}
      CYRNEL_DEFAULT_REGISTRY_URL: ${CYRNEL_DEFAULT_REGISTRY_URL:-}
      CYRNEL_RATE_LIMIT_MAX: ${CYRNEL_RATE_LIMIT_MAX:-}
      CYRNEL_RATE_LIMIT_WINDOW_MS: ${CYRNEL_RATE_LIMIT_WINDOW_MS:-}
      CYRNEL_MAX_CONNECTIONS: ${CYRNEL_MAX_CONNECTIONS:-0}
      CYRNEL_KEEPALIVE_TIMEOUT_MS: ${CYRNEL_KEEPALIVE_TIMEOUT_MS:-5000}
      CYRNEL_HEADERS_TIMEOUT_MS: ${CYRNEL_HEADERS_TIMEOUT_MS:-6000}
      CYRNEL_REQUEST_TIMEOUT_MS: ${CYRNEL_REQUEST_TIMEOUT_MS:-0}
      CYRNEL_MAX_ACTIVE_PROCESSES: ${CYRNEL_MAX_ACTIVE_PROCESSES:-1000}
      CYRNEL_MAX_IDLE_PROCESSES: ${CYRNEL_MAX_IDLE_PROCESSES:-}
      CYRNEL_MAX_CODE_SIZE_BYTES: ${CYRNEL_MAX_CODE_SIZE_BYTES:-102400}
      CYRNEL_INVOKE_TIMEOUT_MS: ${CYRNEL_INVOKE_TIMEOUT_MS:-30000}
      CYRNEL_EMBEDDING_MODEL: ${CYRNEL_EMBEDDING_MODEL:-Xenova/bge-small-en-v1.5}
      CYRNEL_RECONCILE_INTERVAL_MS: ${CYRNEL_RECONCILE_INTERVAL_MS:-1800000}
    volumes:
      - cyrnel-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:9371/health', r => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-actelos/cyrnel}/web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_CYRNEL_API_URL: ""
    ports:
      - "${WEB_PORT:-9372}:9372"
    environment:
      PORT: "9372"
      HOST: 0.0.0.0
      CYRNEL_API_URL: http://api:9371
      CYRNEL_API_KEY: ${CYRNEL_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-actelos/cyrnel}/mcp:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    ports:
      - "${MCP_PORT:-9373}:9373"
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "9373"
      CYRNEL_API_URL: http://api:9371
      CYRNEL_API_KEY: ${CYRNEL_API_KEY:-}
      CYRNEL_API_TIMEOUT_MS: ${CYRNEL_API_TIMEOUT_MS:-30000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cyrnel-data:
